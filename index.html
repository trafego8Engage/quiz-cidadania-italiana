<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080909">
  <title>Quiz de Cidadania Italiana | Gioppo & Conti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="quiz-card" aria-live="polite">
      <header class="quiz-header">
        <img class="brand-logo" src="logo.png" alt="Gioppo & Conti">
        <span id="stepLabel" class="step-label">Passo 1 de 8</span>
      </header>
      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <section id="quizView" class="quiz-view">
        <div id="questionWrap" class="question-wrap is-visible">
          <div id="iconBox" class="icon-box"></div>
          <p class="eyebrow">Análise de perfil</p>
          <h1 id="questionTitle"></h1>
          <p id="questionHelp" class="question-help"></p>
          <div id="investHighlight" class="invest-highlight hidden">
            <p class="invest-lead">Para começar o processo, considere um investimento inicial estimado em <span class="invest-value">R$ 3.000</span></p>
          </div>
          <div id="options" class="options"></div>

          <div id="multiControls" class="multi-controls hidden">
            <p id="multiHint" class="multi-hint"></p>
            <button id="nextButton" class="next-button" type="button">Continuar</button>
          </div>

          <button id="backButton" class="back-button" type="button">‹ Voltar</button>
        </div>
      </section>

      <section id="feedbackView" class="feedback-view hidden">
        <h2 id="feedbackTitle"></h2>
        <p id="feedbackText"></p>
      </section>

      <section id="analysisView" class="analysis-view hidden">
        <img class="analysis-logo" src="logo.png" alt="Gioppo & Conti">
        <div class="spinner"></div>
        <h2>Estamos analisando seu diagnóstico...</h2>
        <div id="analysisChecklist" class="analysis-checklist">
          <div class="check-item"><span class="mark">✓</span><span>Analisando seu vínculo familiar</span></div>
          <div class="check-item"><span class="mark">✓</span><span>Avaliando o momento do processo</span></div>
          <div class="check-item"><span class="mark">✓</span><span>Identificando suas possibilidades</span></div>
          <div class="check-item"><span class="mark">✓</span><span>Preparando seu diagnóstico</span></div>
        </div>
        <div class="progress-track analysis-progress" aria-hidden="true">
          <div id="analysisProgressFill" class="progress-fill"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
