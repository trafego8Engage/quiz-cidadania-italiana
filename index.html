<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de Cidadania Italiana | Gioppo & Conti</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="quiz-card" aria-live="polite">
      <header class="quiz-header">
        <div class="brand">GIOPPO & CONTI</div>
        <div class="progress-meta">
          <span id="stepLabel">Pergunta 1 de 8</span>
          <span id="progressPercent">13%</span>
        </div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      </header>

      <section id="quizView" class="quiz-view">
        <button id="backButton" class="back-button" type="button">← Voltar</button>

        <div class="question-wrap">
          <p class="eyebrow">Análise de perfil</p>
          <h1 id="questionTitle"></h1>
          <p id="questionHelp" class="question-help"></p>
          <div id="options" class="options"></div>

          <div id="multiControls" class="multi-controls hidden">
            <p id="multiHint" class="multi-hint"></p>
            <button id="nextButton" class="next-button" type="button">Continuar</button>
          </div>
        </div>
      </section>

      <section id="analysisView" class="analysis-view hidden">
        <div class="spinner"></div>
        <p class="eyebrow">Analisando suas respostas</p>
        <h2>Estamos preparando seu resultado.</h2>
        <p>Você será direcionado automaticamente para a próxima etapa.</p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
